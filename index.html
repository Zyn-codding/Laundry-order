<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Order Laundry</title>
</head>
<body>

    <h2>Form Laundry Order</h2>

    <form id="orderForm">
        <label>Nama (wajib):</label><br>
        <input type="text" id="nama" required><br><br>

        <label>Alamat (wajib):</label><br>
        <input type="text" id="alamat" required><br><br>

        <label>Foto Baju Anda:</label><br>
        <input type="file" id="foto" accept="image/*" required><br><br>

        <label>Metode Laundry:</label><br>

        <button type="button" onclick="setMethod('Laundry biasa')">Laundry biasa</button>
        <button type="button" onclick="setMethod('Laundry kilat')">Laundry kilat</button>
        <button type="button" onclick="setMethod('Setrika kilat')">Setrika kilat</button>
        <button type="button" onclick="setMethod('Setrika biasa')">Setrika biasa</button>
        <button type="button" onclick="setMethod('Cuci kering lipat')">Cuci kering lipat</button>

        <p id="metodeTerpilih">Metode terpilih: -</p>

        <br><br>
        <button type="submit">Kirim Pesanan</button>
    </form>


<script>
// ================================
//  METODE TERPILIH
// ================================
let metode = "";

function setMethod(m) {
    metode = m;
    document.getElementById("metodeTerpilih").innerText = "Metode terpilih: " + m;
}


// ================================
//  KIRIM PESANAN (SIMPAN LOCALSTORAGE)
// ================================
document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (!metode) {
        alert("Pilih metode dulu!");
        return;
    }

    const nama = document.getElementById("nama").value;
    const alamat = document.getElementById("alamat").value;
    const fotoFile = document.getElementById("foto").files[0];

    const reader = new FileReader();
    reader.onload = function () {
        const fotoBase64 = reader.result;

        let data = JSON.parse(localStorage.getItem("pesananLaundry") || "[]");

        data.push({
            nama,
            alamat,
            metode,
            foto: fotoBase64,
            waktu: new Date().toLocaleString()
        });

        localStorage.setItem("pesananLaundry", JSON.stringify(data));

        alert("Pesanan berhasil dikirim!");

        document.getElementById("orderForm").reset();
        metode = "";
        document.getElementById("metodeTerpilih").innerText = "Metode terpilih: -";
    };

    reader.readAsDataURL(fotoFile);
});
</script>

</body>
</html>
